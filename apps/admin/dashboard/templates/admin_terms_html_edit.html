{% extends "base.html" %}
{% block title %}{{ title }} - Jurin-i BO{% endblock %}

{% block extra_styles %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
<style>
  .editor-wrap {
    min-height: 400px;
    background: #fff;
  }
  .ql-container .ql-editor {
    min-height: 380px;
    font-size: 0.95rem;
    line-height: 1.7;
  }
  .mode-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1rem;
    border: 1px solid var(--color-gray-200);
    border-radius: var(--radius-md);
    overflow: hidden;
    width: fit-content;
  }
  .mode-tab {
    padding: 0.5rem 1.25rem;
    border: none;
    background: #f5f5f5;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 600;
    color: #666;
    transition: all 0.15s;
  }
  .mode-tab.active {
    background: var(--color-primary, #3498db);
    color: #fff;
  }
  .mode-tab:hover:not(.active) {
    background: #e8e8e8;
  }
  #htmlSourceWrap {
    display: none;
  }
  #htmlSourceWrap textarea {
    width: 100%;
    min-height: 400px;
    padding: 1rem;
    box-sizing: border-box;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.875rem;
    line-height: 1.6;
    border: 1px solid var(--color-gray-200);
    border-radius: var(--radius-md);
    resize: vertical;
    tab-size: 2;
  }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <h1>📱 {{ title }}</h1>
  <p class="page-desc">설정 &gt; 지원에서 사용자가 확인하는 {{ title }} 내용을 편집합니다.</p>
</div>

<div class="card">
  <form method="post" action="/admin/terms/{{ doc_type }}/save" id="editForm">
    <div class="mode-tabs">
      <button type="button" class="mode-tab active" id="tabVisual" onclick="switchMode('visual')">에디터</button>
      <button type="button" class="mode-tab" id="tabHtml" onclick="switchMode('html')">HTML 코드</button>
    </div>

    <div id="visualEditorWrap" style="margin-bottom: 1rem;">
      <div id="quill_editor" class="editor-wrap"></div>
    </div>

    <div id="htmlSourceWrap" style="margin-bottom: 1rem;">
      <textarea id="htmlSource" placeholder="HTML 코드를 직접 입력하세요"></textarea>
    </div>

    <input type="hidden" name="content" id="content" />

    <button type="submit" class="btn btn-primary">저장</button>
    <a href="/admin/dashboard" class="btn btn-secondary">취소</a>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
  var currentMode = 'visual';

  function createImageHandler(quill) {
    return function() {
      var input = document.createElement('input');
      input.setAttribute('type', 'file');
      input.setAttribute('accept', 'image/*');
      input.onchange = function() {
        var file = input.files[0];
        if (!file) return;
        if (file.size > 5 * 1024 * 1024) { alert('이미지 크기는 5MB 이하여야 합니다.'); return; }
        var formData = new FormData();
        formData.append('file', file);
        fetch('/api/upload-image', { method: 'POST', body: formData })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            var range = quill.getSelection(true);
            quill.insertEmbed(range.index, 'image', data.url);
            quill.setSelection(range.index + 1);
          })
          .catch(function() { alert('이미지 업로드 실패'); });
      };
      input.click();
    };
  }

  var quill = new Quill('#quill_editor', {
    theme: 'snow',
    placeholder: '내용을 입력하세요',
    modules: {
      toolbar: {
        container: [
          [{ 'header': [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ 'list': 'ordered' }, { 'list': 'bullet' }],
          [{ 'color': [] }, { 'background': [] }],
          [{ 'align': [] }],
          ['link', 'image'],
          ['clean']
        ],
        handlers: {}
      }
    }
  });
  quill.getModule('toolbar').addHandler('image', createImageHandler(quill));

  var initialContent = {{ (doc.content or '')|tojson }};
  if (initialContent) {
    quill.root.innerHTML = initialContent;
  }

  document.getElementById('htmlSource').value = quill.root.innerHTML;

  function switchMode(mode) {
    if (mode === currentMode) return;
    var visualWrap = document.getElementById('visualEditorWrap');
    var htmlWrap = document.getElementById('htmlSourceWrap');
    var tabVisual = document.getElementById('tabVisual');
    var tabHtml = document.getElementById('tabHtml');
    var htmlSource = document.getElementById('htmlSource');

    if (mode === 'html') {
      htmlSource.value = quill.root.innerHTML;
      visualWrap.style.display = 'none';
      htmlWrap.style.display = 'block';
      tabVisual.classList.remove('active');
      tabHtml.classList.add('active');
    } else {
      quill.root.innerHTML = htmlSource.value;
      visualWrap.style.display = 'block';
      htmlWrap.style.display = 'none';
      tabVisual.classList.add('active');
      tabHtml.classList.remove('active');
    }
    currentMode = mode;
  }

  document.getElementById('editForm').addEventListener('submit', function() {
    var contentField = document.getElementById('content');
    if (currentMode === 'html') {
      contentField.value = document.getElementById('htmlSource').value;
    } else {
      contentField.value = quill.root.innerHTML;
    }
  });
</script>
{% endblock %}

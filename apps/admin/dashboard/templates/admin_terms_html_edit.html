{% extends "base.html" %}
{% block title %}{{ title }} - Jurin-i BO{% endblock %}

{% block extra_styles %}
<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet" />
<style>
  .editor-wrap {
    min-height: 400px;
    background: #fff;
  }
  .ql-container .ql-editor {
    min-height: 380px;
    font-size: 0.95rem;
    line-height: 1.7;
  }
  .preview-wrap {
    min-height: 400px;
    background: #fff;
    border: 1px solid var(--color-gray-200);
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  .preview-wrap iframe {
    width: 100%;
    min-height: 400px;
    border: none;
    display: block;
  }
  .mode-tabs {
    display: flex;
    gap: 0;
    margin-bottom: 1rem;
    border: 1px solid var(--color-gray-200);
    border-radius: var(--radius-md);
    overflow: hidden;
    width: fit-content;
  }
  .mode-tab {
    padding: 0.5rem 1.25rem;
    border: none;
    background: #f5f5f5;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 600;
    color: #666;
    transition: all 0.15s;
  }
  .mode-tab.active {
    background: var(--color-primary, #3498db);
    color: #fff;
  }
  .mode-tab:hover:not(.active) {
    background: #e8e8e8;
  }
  #editorWrap, #htmlSourceWrap {
    display: none;
  }
  #htmlSourceWrap textarea {
    width: 100%;
    min-height: 400px;
    padding: 1rem;
    box-sizing: border-box;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.875rem;
    line-height: 1.6;
    border: 1px solid var(--color-gray-200);
    border-radius: var(--radius-md);
    resize: vertical;
    tab-size: 2;
  }
</style>
{% endblock %}

{% block content %}
<div class="page-header">
  <h1>📱 {{ title }}</h1>
  <p class="page-desc">설정 &gt; 지원에서 사용자가 확인하는 {{ title }} 내용을 편집합니다.</p>
</div>

<div class="card">
  <form method="post" action="/admin/terms/{{ doc_type }}/save" id="editForm">
    <div class="mode-tabs">
      <button type="button" class="mode-tab active" id="tabPreview" onclick="switchMode('preview')">미리보기</button>
      <button type="button" class="mode-tab" id="tabEditor" onclick="switchMode('editor')">에디터</button>
      <button type="button" class="mode-tab" id="tabHtml" onclick="switchMode('html')">HTML 코드</button>
    </div>

    <div id="previewWrap" style="margin-bottom: 1rem;">
      <div class="preview-wrap">
        <iframe id="previewFrame" title="미리보기"></iframe>
      </div>
    </div>

    <div id="editorWrap" style="margin-bottom: 1rem;">
      <div id="quill_editor" class="editor-wrap"></div>
    </div>

    <div id="htmlSourceWrap" style="margin-bottom: 1rem;">
      <textarea id="htmlSource" name="content" placeholder="HTML 코드를 직접 입력하세요"></textarea>
    </div>

    <script type="application/json" id="initialContentData">{{ (doc.content or '')|tojson }}</script>

    <button type="submit" class="btn btn-primary">저장</button>
    <a href="/admin/dashboard" class="btn btn-secondary">취소</a>
  </form>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
  var currentMode = 'preview';

  function wrapForPreview(html) {
    if (!html || !html.trim()) return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body></body></html>';
    var s = html.trim();
    if (s.toLowerCase().indexOf('<!doctype') === 0 || s.toLowerCase().indexOf('<html') === 0) {
      return html;
    }
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:inherit;margin:1rem;line-height:1.6;}</style></head><body>' + html + '</body></html>';
  }

  function updatePreview() {
    var htmlSource = document.getElementById('htmlSource');
    var frame = document.getElementById('previewFrame');
    if (frame && htmlSource) {
      frame.srcdoc = wrapForPreview(htmlSource.value);
    }
  }

  var initialContent = '';
  try {
    var dataEl = document.getElementById('initialContentData');
    initialContent = dataEl && dataEl.textContent ? JSON.parse(dataEl.textContent) : '';
  } catch (e) { console.warn('Initial content parse error:', e); }
  document.getElementById('htmlSource').value = initialContent || '';

  var quill = new Quill('#quill_editor', {
    theme: 'snow',
    placeholder: '내용을 입력하세요',
    modules: {
      toolbar: {
        container: [
          [{ 'header': [1, 2, 3, false] }],
          ['bold', 'italic', 'underline', 'strike'],
          [{ 'list': 'ordered' }, { 'list': 'bullet' }],
          [{ 'color': [] }, { 'background': [] }],
          [{ 'align': [] }],
          ['link', 'image'],
          ['clean']
        ],
        handlers: {}
      }
    }
  });
  quill.getModule('toolbar').addHandler('image', function() {
    var input = document.createElement('input');
    input.setAttribute('type', 'file');
    input.setAttribute('accept', 'image/*');
    input.onchange = function() {
      var file = input.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { alert('이미지 크기는 5MB 이하여야 합니다.'); return; }
      var formData = new FormData();
      formData.append('file', file);
      fetch('/api/upload-image', { method: 'POST', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var range = quill.getSelection(true);
          quill.insertEmbed(range.index, 'image', data.url);
          quill.setSelection(range.index + 1);
        })
        .catch(function() { alert('이미지 업로드 실패'); });
    };
    input.click();
  });
  quill.root.innerHTML = initialContent || '';
  quill.on('text-change', function() {
    if (currentMode === 'editor') {
      document.getElementById('htmlSource').value = quill.root.innerHTML;
    }
  });

  updatePreview();

  function switchMode(mode) {
    if (mode === currentMode) return;
    var previewWrap = document.getElementById('previewWrap');
    var editorWrap = document.getElementById('editorWrap');
    var htmlWrap = document.getElementById('htmlSourceWrap');
    var tabPreview = document.getElementById('tabPreview');
    var tabEditor = document.getElementById('tabEditor');
    var tabHtml = document.getElementById('tabHtml');

    if (mode === 'editor') {
      quill.root.innerHTML = document.getElementById('htmlSource').value;
      previewWrap.style.display = 'none';
      editorWrap.style.display = 'block';
      htmlWrap.style.display = 'none';
      tabPreview.classList.remove('active');
      tabEditor.classList.add('active');
      tabHtml.classList.remove('active');
    } else if (mode === 'html') {
      if (currentMode === 'editor') {
        document.getElementById('htmlSource').value = quill.root.innerHTML;
      }
      previewWrap.style.display = 'none';
      editorWrap.style.display = 'none';
      htmlWrap.style.display = 'block';
      tabPreview.classList.remove('active');
      tabEditor.classList.remove('active');
      tabHtml.classList.add('active');
    } else {
      if (currentMode === 'editor') {
        document.getElementById('htmlSource').value = quill.root.innerHTML;
      }
      updatePreview();
      previewWrap.style.display = 'block';
      editorWrap.style.display = 'none';
      htmlWrap.style.display = 'none';
      tabPreview.classList.add('active');
      tabEditor.classList.remove('active');
      tabHtml.classList.remove('active');
    }
    currentMode = mode;
  }

  document.getElementById('editForm').addEventListener('submit', function() {
    if (currentMode === 'editor') {
      document.getElementById('htmlSource').value = quill.root.innerHTML;
    }
  });
</script>
{% endblock %}

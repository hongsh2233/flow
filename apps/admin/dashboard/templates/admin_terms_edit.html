{% extends "base.html" %}
{% block title %}{{ title }} - Jurin-i BO{% endblock %}
{% block content %}
<div class="page-header">
  <h1>📄 {{ title }}</h1>
  <p class="page-desc">설정 &gt; 지원에서 사용자가 확인하는 {{ title }} 내용을 편집합니다.</p>
</div>

<div class="card">
  <form method="post" action="/admin/terms/{{ doc_type }}/save">
    <div style="margin-bottom: 1rem;">
      <label for="content" style="display: block; margin-bottom: 0.5rem; font-weight: 600;">내용</label>
      <textarea name="content" id="content" rows="25" style="width: 100%; padding: 1rem; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; line-height: 1.6; border: 1px solid var(--color-gray-200); border-radius: var(--radius-md); resize: vertical;">{{ doc.content or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">저장</button>
    <a href="/admin/dashboard" class="btn btn-secondary">취소</a>
  </form>
</div>
{% endblock %}
